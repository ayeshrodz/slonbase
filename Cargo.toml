[package]
name = "slonbase"
version = "0.5.0"
edition = "2024"
rust-version = "1.87"
description = "A lightweight, high-performance PocketBase-style backend powered by PostgreSQL"
license = "MIT"
repository = "https://github.com/ayeshrodz/slonbase"
readme = "README.md"
homepage = "https://github.com/ayeshrodz/slonbase"
documentation = "https://github.com/ayeshrodz/slonbase/tree/main/docs"
keywords = ["backend", "postgresql", "pocketbase", "rest-api", "realtime"]
categories = ["web-programming::http-server", "database", "authentication"]
# not on crates.io yet: depend on it from git (see docs/extending.md)
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
deadpool-postgres = "0.14.2"
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
infer = "0.22.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
md-5 = "0.11.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "form", "stream"] }
rquickjs = { version = "0.14.0", optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.9"
tempfile = "3.27.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }

[features]
default = ["js"]
# JavaScript hooks (`*.pb.js`), run by QuickJS
js = ["dep:rquickjs"]

[build-dependencies]
flate2 = "1.1.10"

[dev-dependencies]
form_urlencoded = "1.2.2"
http-body-util = "0.1.5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# smaller and faster debug builds (backtraces keep file and line numbers)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

