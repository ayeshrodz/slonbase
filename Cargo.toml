[package]
name = "slonbase"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight, high-performance PocketBase-style backend powered by PostgreSQL"
license = "MIT"
repository = "https://github.com/ayeshrodz/slonbase"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
deadpool-postgres = "0.14.2"
hex = "0.4.3"
hmac = "0.13.0"
rand = "0.10.3"
regex = "1.13.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.9"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
