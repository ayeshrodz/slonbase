# Asks new contributors to sign CLA.md on their first pull request, and records the signature in
# signatures/cla.json on the cla-signatures branch. The repository owner and bots are exempt.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/ayeshrodz/slonbase/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: ayeshrodz,dependabot[bot],github-actions[bot],claude,bot*
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, please sign the
            [contributor license agreement](https://github.com/ayeshrodz/slonbase/blob/main/CLA.md)
            (you keep your copyright; it lets the project use your work under the Apache License 2.0
            and other terms later) by replying with the sentence below.
