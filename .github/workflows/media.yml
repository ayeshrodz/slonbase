name: Media

# Refreshes the dashboard's screenshots, the recorded tour and the README's animation from a fresh
# demo installation of the current main (scripts/demo/run.sh), and opens a pull request with them
# to review. Run it by hand (Actions, Media, Run workflow), after a release that changes how the
# dashboard looks: the release workflow publishes with the workflow token, whose events don't
# start other workflows.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install ffmpeg, the browser and the demo's dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ffmpeg
          cd ui/test && npm ci && npx playwright install --with-deps chromium
      - run: cargo build --locked
      - name: Record the demo
        run: PUBLISH=1 scripts/demo/run.sh
      - name: Open a pull request with the media
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if git diff --quiet -- docs/assets; then echo "the media didn't change"; exit 0; fi
          # (a re-run gets its own branch: an earlier attempt's push may already be there)
          branch="media/$RUN-$ATTEMPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/assets
          git commit -q -m "Refresh the dashboard's screenshots and tour"
          git push -q origin "$branch"
          gh api "repos/$GITHUB_REPOSITORY/pulls" -f title="Refresh the dashboard's screenshots and tour" \
            -f head="$branch" -f base="${GITHUB_REF_NAME}" \
            -f body="Recorded by the Media workflow (run $RUN) from a fresh demo installation. Look through the screenshots and the tour before merging."
