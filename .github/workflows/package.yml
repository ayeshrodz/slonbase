# Builds static Linux binaries and packages them (.deb, .rpm, .tar.gz) for each architecture.
name: Package

on:
  workflow_call:
    inputs:
      version:
        description: Package version (defaults to the Cargo.toml version)
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          fi
          scripts/package.sh ${{ matrix.target }} ${{ matrix.arch }} "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/linux-*/slonbase
          if-no-files-found: error
