# Builds static Linux binaries and packages them (.deb, .rpm, .tar.gz) for each architecture.
name: Package

on:
  workflow_call:
    inputs:
      version:
        description: Package version (defaults to the Cargo.toml version)
        type: string
        default: ""
      ref:
        description: Commit to build (defaults to the triggering one)
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Install nfpm
        run: |
          base="https://github.com/goreleaser/nfpm/releases/download/v2.46.3"
          tar="nfpm_2.46.3_Linux_x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/nfpm" && cd "$RUNNER_TEMP/nfpm"
          curl -fsSLO "$base/$tar"
          curl -fsSL "$base/checksums.txt" | grep " $tar\$" | sha256sum -c -
          tar -xzf "$tar" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          fi
          scripts/package.sh ${{ matrix.target }} ${{ matrix.arch }} "$version"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/linux-*/slonbase
          if-no-files-found: error
