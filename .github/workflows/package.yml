# Builds static Linux binaries and packages them (.deb, .rpm, .tar.gz) for each architecture.
name: Package

on:
  workflow_call:
    inputs:
      version:
        description: Package version (defaults to the Cargo.toml version)
        type: string
        default: ""
      ref:
        description: Commit to build (defaults to the triggering one)
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cross
      - name: Install nfpm
        run: |
          base="https://github.com/goreleaser/nfpm/releases/download/v2.46.3"
          tar="nfpm_2.46.3_Linux_x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/nfpm" && cd "$RUNNER_TEMP/nfpm"
          curl --retry 12 --retry-delay 15 --retry-max-time 240 --retry-all-errors -fsSLO "$base/$tar"
          curl --retry 12 --retry-delay 15 --retry-max-time 240 --retry-all-errors -fsSL "$base/checksums.txt" | grep " $tar\$" | sha256sum -c -
          tar -xzf "$tar" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          fi
          scripts/package.sh ${{ matrix.target }} ${{ matrix.arch }} "$version"
          # what is shipped: license, notice and third-party licenses in every archive and package
          scripts/check-dist.sh dist "$version"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/linux-*/slonbase
          if-no-files-found: error
