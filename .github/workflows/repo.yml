# Builds the signed apt and dnf repositories from the newest releases' packages and publishes them
# on GitHub Pages (https://slonbase.com/, the repository's custom domain), with the project's page (site/) at the
# root and the documentation site (scripts/build-docs.mjs) at /docs/. The Release workflow starts
# it after publishing a release; it also runs when the page or the docs change on the default
# branch, and can be run by hand. Only the newest releases are kept in the repositories (the
# Pages artifact is limited to 1 GB, and every version adds four packages); older packages stay
# on their release pages.
#
# Needs the REPO_GPG_PRIVATE_KEY secret (an armored signing key without a passphrase) and
# Settings → Pages → Source: GitHub Actions. See MAINTAINING.md.
name: Package repositories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - ui/app/fonts/**
      - scripts/build-docs.mjs
      - scripts/docs/**
      - scripts/build-repo.sh
      - .github/workflows/repo.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the sitemap's lastmod dates come from the history
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends apt-utils createrepo-c rpm
      - name: Download the packages of the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "5"
        run: |
          mkdir pkgs
          gh release list --repo "$GITHUB_REPOSITORY" --limit "$KEEP" --exclude-drafts --exclude-pre-releases \
              --json tagName --jq '.[].tagName' |
          while read -r tag; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir pkgs \
                  --pattern '*.deb' --pattern '*.rpm'
          done
          ls -l pkgs
      - name: Import the signing key
        id: key
        env:
          KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
              echo "::error::the REPO_GPG_PRIVATE_KEY secret is not set (see MAINTAINING.md)"
              exit 1
          fi
          printf '%s\n' "$KEY" | gpg --batch --import
          echo "fingerprint=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_OUTPUT"
      - name: Build the repositories
        env:
          # the repository variable SITE_URL overrides the address (a fork, say)
          SITE_URL: ${{ vars.SITE_URL || 'https://slonbase.com' }}
        run: |
          scripts/build-repo.sh pkgs site-out "${{ steps.key.outputs.fingerprint }}" "$SITE_URL"
      - name: Add the project's page
        run: |
          cp -r site/. site-out/
          mkdir -p site-out/assets
          cp -r docs/assets/. site-out/assets/
          mkdir -p site-out/assets/fonts
          cp ui/app/fonts/* site-out/assets/fonts/
      - name: Build the documentation site
        run: node scripts/build-docs.mjs site-out/docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          # GitHub syncs the files for about 10 minutes at times; the default wait is 10
          timeout: 1800000
      # tell Bing, Yandex and the other IndexNow engines which pages exist (Google reads the
      # sitemap); a failure here never fails the deploy
      - name: Tell search engines about the pages
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://slonbase.com' }}
        run: |
          key=ba30c963bbaa1e478f0953e520f282c2
          host="${SITE_URL#https://}"
          urls=$(curl -fsS --retry 5 --retry-delay 10 "$SITE_URL/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | sed 's/.*/"&"/' | paste -sd, -)
          curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$host\",\"key\":\"$key\",\"keyLocation\":\"$SITE_URL/$key.txt\",\"urlList\":[$urls]}"
