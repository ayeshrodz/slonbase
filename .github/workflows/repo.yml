# Builds the signed apt and dnf repositories from the supported releases' packages and publishes them
# on GitHub Pages (https://slonbase.com/, the repository's custom domain), with the project's page (site/) at the
# root and the documentation site (scripts/build-docs.mjs) at /docs/. The Release workflow starts
# it after publishing a release; it also runs when the page or the docs change on the default
# branch, and can be run by hand. The repositories keep the newest three versions of every
# release line still supported (packaging/supported-lines.txt, in step with SECURITY.md) and
# always the newest release; the Pages artifact is limited to 1 GB, and every version adds four
# packages. Older packages stay on their release pages.
#
# Three jobs, so the signing key is never in a job that runs the page or docs build:
#   sign   - in the `package-signing` environment, the only job that sees REPO_GPG_PRIVATE_KEY:
#            downloads the packages, checks the key's fingerprint, signs the repositories
#   site   - no secrets: builds the project's page and the docs around the signed repositories
#   deploy - publishes the result on GitHub Pages
# Needs the REPO_GPG_PRIVATE_KEY secret in the `package-signing` environment (an armored signing
# key without a passphrase) and Settings → Pages → Source: GitHub Actions. See MAINTAINING.md.
name: Package repositories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - ui/app/fonts/**
      - scripts/build-docs.mjs
      - scripts/docs/**
      - scripts/build-repo.sh
      - .github/workflows/repo.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    environment: package-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends apt-utils createrepo-c rpm
      - name: Download the packages of the supported releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pkgs
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts --exclude-pre-releases \
              --json tagName --jq '.[].tagName' > releases.txt
          scripts/supported-releases.py < releases.txt > keep.txt
          echo "keeping: $(tr '\n' ' ' < keep.txt)"
          while read -r tag; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir pkgs \
                  --pattern '*.deb' --pattern '*.rpm'
          done < keep.txt
          ls -l pkgs
      - name: Import the signing key
        id: key
        env:
          KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          # the key users already trust (https://slonbase.com/slonbase.asc); a fork with its own
          # key sets the repository variable REPO_KEY_FINGERPRINT
          EXPECTED: ${{ vars.REPO_KEY_FINGERPRINT || '95697FA73AFBAC43E64962F1C7DF885C74BB3942' }}
        run: |
          if [ -z "$KEY" ]; then
              echo "::error::the REPO_GPG_PRIVATE_KEY secret is not set in the package-signing environment (see MAINTAINING.md)"
              exit 1
          fi
          printf '%s\n' "$KEY" | gpg --batch --import
          fpr=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
          echo "signing key: $fpr"
          if [ "$fpr" != "$EXPECTED" ]; then
              echo "::error::the signing key is $fpr, not $EXPECTED: users' apt and dnf would reject the repositories. Put the right key in the secret, or, for a new key, set REPO_KEY_FINGERPRINT and tell users to import it again"
              exit 1
          fi
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"
      - name: Build and sign the repositories
        env:
          # the repository variable SITE_URL overrides the address (a fork, say)
          SITE_URL: ${{ vars.SITE_URL || 'https://slonbase.com' }}
        run: |
          scripts/build-repo.sh pkgs repos "${{ steps.key.outputs.fingerprint }}" "$SITE_URL"
      - name: Forget the key
        if: always()
        run: rm -rf ~/.gnupg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-repositories
          path: repos
          retention-days: 1
          if-no-files-found: error

  site:
    needs: sign
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the sitemap's lastmod dates come from the history
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-repositories
          path: site-out
      - name: Add the project's page
        run: |
          cp -r site/. site-out/
          mkdir -p site-out/assets
          cp -r docs/assets/. site-out/assets/
          mkdir -p site-out/assets/fonts
          cp ui/app/fonts/* site-out/assets/fonts/
      - name: Build the documentation site
        run: node scripts/build-docs.mjs site-out/docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-out

  deploy:
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # GitHub syncs the files for about 10 minutes at times; the default wait is 10
          timeout: 1800000
      # tell Bing, Yandex and the other IndexNow engines which pages exist (Google reads the
      # sitemap); a failure here never fails the deploy
      - name: Tell search engines about the pages
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://slonbase.com' }}
        run: |
          key=ba30c963bbaa1e478f0953e520f282c2
          host="${SITE_URL#https://}"
          urls=$(curl -fsS --retry 5 --retry-delay 10 "$SITE_URL/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | sed 's/.*/"&"/' | paste -sd, -)
          curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$host\",\"key\":\"$key\",\"keyLocation\":\"$SITE_URL/$key.txt\",\"urlList\":[$urls]}"
