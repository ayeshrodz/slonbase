# Builds the signed apt and dnf repositories from every release's packages and publishes them
# on GitHub Pages (https://<owner>.github.io/<repo>/). The Release workflow starts it after
# publishing a release; it can also be run by hand.
#
# Needs the REPO_GPG_PRIVATE_KEY secret (an armored signing key without a passphrase) and
# Settings → Pages → Source: GitHub Actions. See CONTRIBUTING.md.
name: Package repositories

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends apt-utils createrepo-c rpm
      - name: Download the packages of every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pkgs
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts --exclude-pre-releases \
              --json tagName --jq '.[].tagName' |
          while read -r tag; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir pkgs \
                  --pattern '*.deb' --pattern '*.rpm'
          done
          ls -l pkgs
      - name: Import the signing key
        id: key
        env:
          KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
              echo "::error::the REPO_GPG_PRIVATE_KEY secret is not set (see CONTRIBUTING.md)"
              exit 1
          fi
          printf '%s\n' "$KEY" | gpg --batch --import
          echo "fingerprint=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_OUTPUT"
      - name: Build the repositories
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          scripts/build-repo.sh pkgs site "${{ steps.key.outputs.fingerprint }}" \
              "https://$owner.github.io/${GITHUB_REPOSITORY#*/}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
