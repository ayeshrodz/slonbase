# Builds slonbase for macOS (Apple silicon) and Windows (x64) and packs each as an archive: a
# .tar.gz for macOS and a .zip for Windows, with the license files, next to the Linux packages of
# the Package workflow. Each archive is unpacked and used the way a person would (scripts/
# e2e-smoke.mjs) before it is uploaded, so what is tested is what is downloaded. Called by the
# Release workflow, and started by hand to try the archives of any commit.
#
# These builds are experimental: they are not signed (see docs/installation.md#macos and
# #windows for what each system asks, and how to check a download).
name: Package (macOS and Windows)

on:
  workflow_call:
    inputs:
      version:
        description: Archive version (defaults to the Cargo.toml version)
        type: string
        default: ""
      ref:
        description: Commit to build (defaults to the triggering one)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Archive version (defaults to the Cargo.toml version)
        type: string
        default: ""
      ref:
        description: Commit to build (defaults to the one selected for the run)
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            artifact: macos-arm64
          - name: Windows (x64)
            os: windows-latest
            artifact: windows-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.artifact }}
      - uses: ./.github/actions/local-postgres

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # the third-party licenses of exactly what this build contains (from Cargo.lock)
          py=$(command -v python3 || command -v python)
          "$py" scripts/third-party.py
          mkdir -p dist
          name="slonbase-$version-$ARTIFACT"
          case "$RUNNER_OS" in
            macOS)
              tar -czf "dist/$name.tar.gz" -C target/release slonbase \
                -C "$PWD" LICENSE NOTICE THIRD-PARTY-LICENSES.md README.md
              ;;
            Windows)
              powershell -NoProfile -Command "Compress-Archive -Force -Path 'target/release/slonbase.exe','LICENSE','NOTICE','THIRD-PARTY-LICENSES.md','README.md' -DestinationPath 'dist/$name.zip'"
              ;;
          esac
          ls -l dist

      # the archive as a person gets it: unpacked, started on an empty database, and used
      - name: Use the archive
        shell: bash
        run: |
          set -euo pipefail
          unpack="$RUNNER_TEMP/unpacked"
          rm -rf "$unpack" && mkdir -p "$unpack"
          case "$RUNNER_OS" in
            macOS)
              tar -xzf "dist/slonbase-$VERSION-$ARTIFACT.tar.gz" -C "$unpack"
              bin="$unpack/slonbase"
              file "$bin"
              ;;
            Windows)
              powershell -NoProfile -Command "Expand-Archive -Force -Path 'dist/slonbase-$VERSION-$ARTIFACT.zip' -DestinationPath '$unpack'"
              bin="$unpack/slonbase.exe"
              ;;
          esac
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES.md README.md; do test -s "$unpack/$f"; done
          "$PGBIN/psql" -h 127.0.0.1 -p 5433 -U postgres -c "CREATE DATABASE e2e"
          SLONBASE_BIN="$bin" DATABASE_URL="postgres://postgres@127.0.0.1:5433/e2e?sslmode=disable" node scripts/e2e-smoke.mjs
        env:
          ARTIFACT: ${{ matrix.artifact }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
