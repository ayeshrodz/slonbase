name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # oldest supported and newest
        postgres: ["14", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SLONBASE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      SLONBASE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      SLONBASE_TEST_S3_ACCESS_KEY: slonbase
      SLONBASE_TEST_S3_SECRET: slonbase-secret
      MINIO_VERSION: v0.0.0-20260212201848-7aac2a2c5b7c
    steps:
      - uses: actions/checkout@v4
      # MinIO no longer publishes images, so a pinned version is built from source once
      - name: Cache MinIO
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/minio/bin
          key: minio-${{ env.MINIO_VERSION }}
      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/minio/bin" go install "github.com/minio/minio@$MINIO_VERSION"
      - name: Start MinIO
        run: |
          mkdir -p "$HOME/minio/data"
          MINIO_ROOT_USER="$SLONBASE_TEST_S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$SLONBASE_TEST_S3_SECRET" \
            nohup "$HOME/minio/bin/minio" server "$HOME/minio/data" --address 127.0.0.1:9000 > "$HOME/minio/log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          cat "$HOME/minio/log"
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  package:
    needs: [lint, test]
    uses: ./.github/workflows/package.yml
    with:
      version: ""

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image from source
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
