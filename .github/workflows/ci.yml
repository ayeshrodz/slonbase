name: CI

# Pull requests are tested as pull requests, and main once more after the merge (the Release
# workflow waits for that run). A branch push isn't tested on its own: with a pull request open
# it would run twice, and GitHub counts the cancelled duplicate as a failed required check.
#
# How much runs depends on the change (job `plan`, scripts/ci-plan.sh):
# - documentation, the project page, benchmarks and the other workflows: the checks in `lint`
#   and `site`, a few minutes;
# - code: the build and every test on the oldest and the newest PostgreSQL;
# - everything, on all five PostgreSQL versions: a release (a version with no tag yet, which is
#   what the Release workflow publishes), the nightly run, a run started by hand (Actions, CI,
#   Run workflow: also how to run it on a branch before a release), and a change to CI itself,
#   the dependencies or the migrations.
# The one check a pull request needs is `CI passed`, which fails when a job that ran failed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"

permissions:
  contents: read

# a newer push to the same pull request replaces the run in progress; runs on main never cancel
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # the database tests must run in CI, not skip
  SLONBASE_REQUIRE_TEST_DATABASE: "1"

jobs:
  # what this change needs (see the comment at the top)
  plan:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      code: ${{ steps.plan.outputs.code }}
      web: ${{ steps.plan.outputs.web }}
      postgres: ${{ steps.plan.outputs.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit and its parents: a pull request's merge commit, or a push's previous tip
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          files=""
          case "$EVENT" in
            pull_request) files=$(git diff --name-only --no-renames HEAD^1 HEAD || true) ;;
            push) files=$(git diff --name-only --no-renames "$BEFORE" HEAD || true) ;;
          esac
          # a version with no tag is a release, the way the Release workflow decides it
          release=0
          if [ "$EVENT" = push ]; then
            version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
            git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || release=1
          fi
          printf '%s\n' "$files" | CI_EVENT="$EVENT" CI_RELEASE="$release" scripts/ci-plan.sh | tee -a "$GITHUB_OUTPUT"
      - name: Check the rules
        run: scripts/ci-plan.sh --test

  lint:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # (the Rust steps are for a change to code; the rest of the checks below always run)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: needs.plan.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.plan.outputs.code == 'true'
      - run: cargo fmt --all --check
        if: needs.plan.outputs.code == 'true'
      # the installer people pipe into a root shell
      - run: shellcheck -s sh site/install.sh packaging/scripts/*.sh scripts/package.sh scripts/check-dist.sh scripts/installer-test/run.sh
      # the other scripts (bash), warnings and errors
      - run: shellcheck --severity=warning scripts/ci-plan.sh bench/run.sh compat/run.sh compat/*/run.sh scripts/build-repo.sh scripts/release-notes.sh scripts/demo/run.sh bench/compare.sh scripts/fleet-test/run.sh soak/run.sh ui/test/run.sh site/test/run.sh
      # the workflows themselves (expressions, permissions, shell in `run:`)
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      # the third-party license list (written at packaging time, from Cargo.lock) can be generated
      - run: python3 scripts/third-party.py
      # so can the release's SBOM, and the dashboard's vendored files are still the ones it lists
      - run: python3 scripts/sbom.py 0.0.0 /dev/null
      # the release lines kept in the apt and dnf repositories agree with SECURITY.md
      - run: scripts/supported-releases.py --check
      # preparing a release, a release candidate and the release after it changes what it should
      - run: python3 scripts/test-prepare-release.py
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: needs.plan.outputs.code == 'true'
      # the documentation site builds, and its links between pages and headings all resolve
      - run: node scripts/build-docs.mjs "$RUNNER_TEMP/docs"
      # the site, the docs and the 404 page carry the dashboard's current tokens, and no loose colours
      - run: node scripts/build-tokens.mjs --check
      # the benchmark tables in the README and the docs match the newest published comparison
      - run: node scripts/bench-figures.mjs --check
      # which releases the project page shows (a newer candidate too) and the commands it gives
      - run: node scripts/build-site.mjs --test

  # the oldest Rust the project says it supports (`rust-version` in Cargo.toml) builds it
  msrv:
    name: minimum Rust version
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust version Cargo.toml promises
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked

  # known vulnerabilities in dependencies (RustSec); releases wait for CI, so this blocks them too
  audit:
    needs: plan
    # advisories come out on their own schedule, so this runs with everything: before a release
    # and every night
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      - run: cargo audit

  test:
    name: test (PostgreSQL ${{ matrix.postgres }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # every major version the docs promise, 14 (the oldest) up to the newest, when everything
        # runs; otherwise the two ends, which is where versions differ
        postgres: ${{ fromJSON(needs.plan.outputs.postgres) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SLONBASE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      SLONBASE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      SLONBASE_TEST_S3_ACCESS_KEY: slonbase
      SLONBASE_TEST_S3_SECRET: slonbase-secret
      MINIO_VERSION: v0.0.0-20260212201848-7aac2a2c5b7c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # MinIO no longer publishes images, so a pinned version is built from source once
      - name: Cache MinIO
        id: minio-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/minio/bin
          key: minio-${{ env.MINIO_VERSION }}
      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/minio/bin" go install "github.com/minio/minio@$MINIO_VERSION"
      - name: Start MinIO
        run: |
          mkdir -p "$HOME/minio/data"
          MINIO_ROOT_USER="$SLONBASE_TEST_S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$SLONBASE_TEST_S3_SECRET" \
            nohup "$HOME/minio/bin/minio" server "$HOME/minio/data" --address 127.0.0.1:9000 > "$HOME/minio/log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          cat "$HOME/minio/log"
          exit 1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      # the tests run in parallel across the test programs too (.config/nextest.toml)
      - run: cargo nextest run --locked
      # (nextest doesn't run documentation examples)
      - run: cargo test --doc --locked

  # the debug binary, built once for the jobs below that run it
  build:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slonbase-debug
          path: target/debug/slonbase
          retention-days: 1
          if-no-files-found: error

  # site/install.sh in clean containers, with packages built from this commit: a failed package
  # changes nothing, a rerun after a failure reuses the role it made, an upgrade keeps the
  # configuration, and the service starts and signs in (scripts/installer-test/run.sh).
  # The images are as new as the build machine, since the debug binary links its C library.
  installer:
    name: installer (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", format: deb }
          - { image: "debian:trixie", format: deb }
          - { image: "fedora:42", format: rpm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - id: nfpmcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm
          key: nfpm-2.46.3
      - name: Install nfpm
        if: steps.nfpmcache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/goreleaser/nfpm/releases/download/v2.46.3"
          tar="nfpm_2.46.3_Linux_x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/nfpm" && cd "$RUNNER_TEMP/nfpm"
          curl --retry 12 --retry-delay 15 --retry-max-time 240 --retry-all-errors -fsSLO "$base/$tar"
          curl --retry 12 --retry-delay 15 --retry-max-time 240 --retry-all-errors -fsSL "$base/checksums.txt" | grep " $tar\$" | sha256sum -c -
          tar -xzf "$tar" nfpm
      - name: Use nfpm
        run: echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      - name: Package two versions of this build
        run: |
          mkdir -p target/x86_64-unknown-linux-musl/release
          install -m 0755 "$RUNNER_TEMP/slonbase/slonbase" target/x86_64-unknown-linux-musl/release/slonbase
          scripts/package.sh x86_64-unknown-linux-musl amd64 0.0.1
          scripts/package.sh x86_64-unknown-linux-musl amd64 0.0.2
      - name: Run the installer checks
        run: |
          if [ "${{ matrix.format }}" = deb ]; then
            scripts/installer-test/run.sh "${{ matrix.image }}" dist/slonbase_0.0.1_amd64.deb dist/slonbase_0.0.2_amd64.deb
          else
            scripts/installer-test/run.sh "${{ matrix.image }}" dist/slonbase-0.0.1-1.x86_64.rpm dist/slonbase-0.0.2-1.x86_64.rpm
          fi

  # the official PocketBase JavaScript SDK against slonbase, and against PocketBase itself
  # (which keeps the suite's expectations honest)
  compat:
    name: compatibility (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [slonbase, pocketbase]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      POCKETBASE_VERSION: "0.40.5"
      # the zip's SHA-256, from that release's checksums.txt (update with the version)
      POCKETBASE_SHA256: "1dbea1b01eb3dfe64953513859d01e759c96650c4e3264fa4eecd54b769382e4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compat/package-lock.json
      - run: npm ci
        working-directory: compat
      - if: matrix.target == 'slonbase'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - if: matrix.target == 'slonbase'
        name: Use the shared build
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          echo "SLONBASE_BIN=$RUNNER_TEMP/slonbase/slonbase" >> "$GITHUB_ENV"
      - id: pbcache
        if: matrix.target == 'pocketbase'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/pocketbase
          key: pocketbase-${{ env.POCKETBASE_VERSION }}-${{ env.POCKETBASE_SHA256 }}
      - name: Download PocketBase
        if: matrix.target == 'pocketbase' && steps.pbcache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}"
          zip="pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          mkdir -p "$HOME/pocketbase" && cd "$HOME/pocketbase"
          curl --retry 12 --retry-delay 15 --retry-max-time 240 --retry-all-errors -fsSLO "$base/$zip"
          echo "${POCKETBASE_SHA256}  $zip" | sha256sum -c -
          unzip -q "$zip" pocketbase
      - name: Use PocketBase
        if: matrix.target == 'pocketbase'
        run: echo "POCKETBASE_BIN=$HOME/pocketbase/pocketbase" >> "$GITHUB_ENV"
      - run: compat/run.sh ${{ matrix.target }}

  # PocketBase and slonbase side by side: the same requests, their answers compared as JSON,
  # with fuzzed HTML for the `:excerpt` modifier (compat/diff)
  differential:
    name: differential (PocketBase vs slonbase)
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      POCKETBASE_VERSION: "0.40.5"
      # the zip's SHA-256, from that release's checksums.txt (update with the version)
      POCKETBASE_SHA256: "1dbea1b01eb3dfe64953513859d01e759c96650c4e3264fa4eecd54b769382e4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - name: Use the shared build
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          echo "SLONBASE_BIN=$RUNNER_TEMP/slonbase/slonbase" >> "$GITHUB_ENV"
      - id: pbcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/pocketbase
          key: pocketbase-${{ env.POCKETBASE_VERSION }}-${{ env.POCKETBASE_SHA256 }}
      - name: Download PocketBase
        if: steps.pbcache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}"
          zip="pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          mkdir -p "$HOME/pocketbase" && cd "$HOME/pocketbase"
          curl --retry 12 --retry-delay 15 --retry-max-time 240 --retry-all-errors -fsSLO "$base/$zip"
          echo "${POCKETBASE_SHA256}  $zip" | sha256sum -c -
          unzip -q "$zip" pocketbase
      - name: Use PocketBase
        run: echo "POCKETBASE_BIN=$HOME/pocketbase/pocketbase" >> "$GITHUB_ENV"
      - run: compat/diff/run.sh

  # the dashboard: accessibility (axe, WCAG 2 AA) and screenshots against the baselines
  # the project page, the docs and the 404 page on phones, a tablet and desktops, in both themes:
  # nothing wider than the screen, tap targets of 44px, no axe violations, no console errors
  site:
    name: site (layout and accessibility)
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the checks and Chromium
        working-directory: site/test
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: site/test/run.sh
      - name: Upload the screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-screenshots
          path: site/test/out/
          if-no-files-found: ignore

  dashboard:
    name: dashboard (accessibility and screenshots)
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - name: Use the shared build
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          echo "SLONBASE_BIN=$RUNNER_TEMP/slonbase/slonbase" >> "$GITHUB_ENV"
      - name: Install the checks and Chromium
        working-directory: ui/test
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: ui/test/run.sh
      - name: Upload the screenshots that differ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-screenshots
          path: ui/test/out/
          if-no-files-found: ignore

  # PocketBase data (seeded through its API, then its backup) imported into slonbase
  import:
    name: PocketBase import
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      POCKETBASE_VERSION: "0.40.5"
      # the zip's SHA-256, from that release's checksums.txt (update with the version)
      POCKETBASE_SHA256: "1dbea1b01eb3dfe64953513859d01e759c96650c4e3264fa4eecd54b769382e4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compat/package-lock.json
      - run: npm ci
        working-directory: compat
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - name: Use the shared build
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          echo "SLONBASE_BIN=$RUNNER_TEMP/slonbase/slonbase" >> "$GITHUB_ENV"
      - id: pbcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/pocketbase
          key: pocketbase-${{ env.POCKETBASE_VERSION }}-${{ env.POCKETBASE_SHA256 }}
      - name: Download PocketBase
        if: steps.pbcache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}"
          zip="pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          mkdir -p "$HOME/pocketbase" && cd "$HOME/pocketbase"
          curl --retry 12 --retry-delay 15 --retry-max-time 240 --retry-all-errors -fsSLO "$base/$zip"
          echo "${POCKETBASE_SHA256}  $zip" | sha256sum -c -
          unzip -q "$zip" pocketbase
      - name: Use PocketBase
        run: echo "POCKETBASE_BIN=$HOME/pocketbase/pocketbase" >> "$GITHUB_ENV"
      - run: compat/import/run.sh
      - name: compat/import/run.sh, with PocketBase's settings encrypted
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -qc 'CREATE DATABASE import_encrypted'
          DATABASE_URL='postgres://postgres:postgres@127.0.0.1:5432/import_encrypted?sslmode=disable' \
            ENCRYPTION_KEY=0123456789abcdef0123456789abcdef compat/import/run.sh

  # several instances behind a balancer with no affinity on one PostgreSQL: tokens, schema, settings,
  # rate limits, realtime and projects, directly and through PgBouncer in transaction mode
  fleet:
    name: several instances (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, pgbouncer]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - name: Install PgBouncer
        if: matrix.mode == 'pgbouncer'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pgbouncer
          sudo systemctl disable --now pgbouncer || true
      - name: Run the scenarios
        env:
          FLEET_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          export SLONBASE_BIN="$RUNNER_TEMP/slonbase/slonbase"
          if [ "${{ matrix.mode }}" = pgbouncer ]; then export FLEET_POOLER=pgbouncer; fi
          scripts/fleet-test/run.sh 3

  # a released slonbase with data, upgraded to this build in place
  upgrade:
    name: upgrade from ${{ matrix.from }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # the oldest release crosses every migration; "previous" is the newest older release
        from: ["0.1.0", previous]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compat/package-lock.json
      - run: npm ci
        working-directory: compat
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - name: Use the shared build
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          echo "SLONBASE_BIN=$RUNNER_TEMP/slonbase/slonbase" >> "$GITHUB_ENV"
      - run: compat/upgrade/run.sh ${{ matrix.from }}
        env:
          GH_TOKEN: ${{ github.token }}

  # the one check a pull request needs: every job that ran passed. A job that was skipped wasn't
  # needed for this change (see `plan`), which a required check named after the job can't say
  passed:
    name: CI passed
    if: ${{ always() }}
    needs: [plan, lint, msrv, audit, build, test, installer, compat, differential, site, dashboard, import, fleet, upgrade]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          echo "$NEEDS" | jq -e '[.plan.result, .lint.result] | all(. == "success")' > /dev/null || { echo "::error::plan or lint didn't pass"; exit 1; }
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::a job failed"
            exit 1
          fi
