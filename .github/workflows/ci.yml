name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one run per commit, whether it arrives by push or in a pull request
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # the database tests must run in CI, not skip
  SLONBASE_REQUIRE_TEST_DATABASE: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # the installer people pipe into a root shell
      - run: shellcheck -s sh site/install.sh packaging/scripts/*.sh scripts/package.sh scripts/check-dist.sh
      # the other scripts (bash), warnings and errors
      - run: shellcheck --severity=warning bench/run.sh compat/run.sh compat/*/run.sh scripts/build-repo.sh scripts/release-notes.sh scripts/demo/run.sh scripts/fleet-test/run.sh soak/run.sh ui/test/run.sh
      # the workflows themselves (expressions, permissions, shell in `run:`)
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      # the third-party license list matches Cargo.lock
      - run: python3 scripts/third-party.py --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # the documentation site builds, and its links between pages and headings all resolve
      - run: node scripts/build-docs.mjs "$RUNNER_TEMP/docs"

  # known vulnerabilities in dependencies (RustSec); releases wait for CI, so this blocks them too
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  test:
    name: test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # oldest supported and newest
        postgres: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SLONBASE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      SLONBASE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      SLONBASE_TEST_S3_ACCESS_KEY: slonbase
      SLONBASE_TEST_S3_SECRET: slonbase-secret
      MINIO_VERSION: v0.0.0-20260212201848-7aac2a2c5b7c
    steps:
      - uses: actions/checkout@v7
      # MinIO no longer publishes images, so a pinned version is built from source once
      - name: Cache MinIO
        id: minio-cache
        uses: actions/cache@v6
        with:
          path: ~/minio/bin
          key: minio-${{ env.MINIO_VERSION }}
      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/minio/bin" go install "github.com/minio/minio@$MINIO_VERSION"
      - name: Start MinIO
        run: |
          mkdir -p "$HOME/minio/data"
          MINIO_ROOT_USER="$SLONBASE_TEST_S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$SLONBASE_TEST_S3_SECRET" \
            nohup "$HOME/minio/bin/minio" server "$HOME/minio/data" --address 127.0.0.1:9000 > "$HOME/minio/log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          cat "$HOME/minio/log"
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # the debug binary, built once for the jobs below that run it
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: actions/upload-artifact@v7
        with:
          name: slonbase-debug
          path: target/debug/slonbase
          retention-days: 1
          if-no-files-found: error

  # the official PocketBase JavaScript SDK against slonbase, and against PocketBase itself
  # (which keeps the suite's expectations honest)
  compat:
    name: compatibility (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [slonbase, pocketbase]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      POCKETBASE_VERSION: "0.40.5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compat/package-lock.json
      - run: npm ci
        working-directory: compat
      - if: matrix.target == 'slonbase'
        uses: actions/download-artifact@v8
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - if: matrix.target == 'slonbase'
        name: Use the shared build
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          echo "SLONBASE_BIN=$RUNNER_TEMP/slonbase/slonbase" >> "$GITHUB_ENV"
      - if: matrix.target == 'pocketbase'
        name: Download PocketBase
        run: |
          base="https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}"
          zip="pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          mkdir -p "$HOME/pocketbase" && cd "$HOME/pocketbase"
          curl -fsSLO "$base/$zip"
          curl -fsSL "$base/checksums.txt" | grep " $zip\$" | sha256sum -c -
          unzip -q "$zip" pocketbase
          echo "POCKETBASE_BIN=$HOME/pocketbase/pocketbase" >> "$GITHUB_ENV"
      - run: compat/run.sh ${{ matrix.target }}

  # PocketBase and slonbase side by side: the same requests, their answers compared as JSON,
  # with fuzzed HTML for the `:excerpt` modifier (compat/diff)
  differential:
    name: differential (PocketBase vs slonbase)
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      POCKETBASE_VERSION: "0.40.5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - name: Use the shared build
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          echo "SLONBASE_BIN=$RUNNER_TEMP/slonbase/slonbase" >> "$GITHUB_ENV"
      - name: Download PocketBase
        run: |
          base="https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}"
          zip="pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          mkdir -p "$HOME/pocketbase" && cd "$HOME/pocketbase"
          curl -fsSLO "$base/$zip"
          curl -fsSL "$base/checksums.txt" | grep " $zip\$" | sha256sum -c -
          unzip -q "$zip" pocketbase
          echo "POCKETBASE_BIN=$HOME/pocketbase/pocketbase" >> "$GITHUB_ENV"
      - run: compat/diff/run.sh

  # the dashboard: accessibility (axe, WCAG 2 AA) and screenshots against the baselines
  dashboard:
    name: dashboard (accessibility and screenshots)
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - name: Use the shared build
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          echo "SLONBASE_BIN=$RUNNER_TEMP/slonbase/slonbase" >> "$GITHUB_ENV"
      - name: Install the checks and Chromium
        working-directory: ui/test
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: ui/test/run.sh
      - name: Upload the screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-screenshots
          path: ui/test/out/
          if-no-files-found: ignore

  # PocketBase data (seeded through its API, then its backup) imported into slonbase
  import:
    name: PocketBase import
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      POCKETBASE_VERSION: "0.40.5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compat/package-lock.json
      - run: npm ci
        working-directory: compat
      - uses: actions/download-artifact@v8
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - name: Use the shared build
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          echo "SLONBASE_BIN=$RUNNER_TEMP/slonbase/slonbase" >> "$GITHUB_ENV"
      - name: Download PocketBase
        run: |
          base="https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}"
          zip="pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          mkdir -p "$HOME/pocketbase" && cd "$HOME/pocketbase"
          curl -fsSLO "$base/$zip"
          curl -fsSL "$base/checksums.txt" | grep " $zip\$" | sha256sum -c -
          unzip -q "$zip" pocketbase
          echo "POCKETBASE_BIN=$HOME/pocketbase/pocketbase" >> "$GITHUB_ENV"
      - run: compat/import/run.sh
      - name: compat/import/run.sh, with PocketBase's settings encrypted
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -qc 'CREATE DATABASE import_encrypted'
          DATABASE_URL='postgres://postgres:postgres@127.0.0.1:5432/import_encrypted?sslmode=disable' \
            ENCRYPTION_KEY=0123456789abcdef0123456789abcdef compat/import/run.sh

  # several instances behind a balancer with no affinity on one PostgreSQL: tokens, schema, settings,
  # rate limits, realtime and projects, directly and through PgBouncer in transaction mode
  fleet:
    name: several instances (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, pgbouncer]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - name: Install PgBouncer
        if: matrix.mode == 'pgbouncer'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pgbouncer
          sudo systemctl disable --now pgbouncer || true
      - name: Run the scenarios
        env:
          FLEET_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          export SLONBASE_BIN="$RUNNER_TEMP/slonbase/slonbase"
          if [ "${{ matrix.mode }}" = pgbouncer ]; then export FLEET_POOLER=pgbouncer; fi
          scripts/fleet-test/run.sh 3

  # a released slonbase with data, upgraded to this build in place
  upgrade:
    name: upgrade from ${{ matrix.from }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # the oldest release crosses every migration; "previous" is the newest older release
        from: ["0.1.0", previous]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compat/package-lock.json
      - run: npm ci
        working-directory: compat
      - uses: actions/download-artifact@v8
        with:
          name: slonbase-debug
          path: ${{ runner.temp }}/slonbase
      - name: Use the shared build
        run: |
          chmod +x "$RUNNER_TEMP/slonbase/slonbase"
          echo "SLONBASE_BIN=$RUNNER_TEMP/slonbase/slonbase" >> "$GITHUB_ENV"
      - run: compat/upgrade/run.sh ${{ matrix.from }}
        env:
          GH_TOKEN: ${{ github.token }}
