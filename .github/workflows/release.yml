# Publishes a release when a version tag (e.g. v0.1.0) is pushed:
# GitHub release with packages + checksums, and a multi-arch image on ghcr.io.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Check CHANGELOG.md has the release notes
        run: scripts/release-notes.sh "${{ steps.version.outputs.version }}" > /dev/null

  package:
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  publish:
    needs: [verify, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS
      - name: Release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            scripts/release-notes.sh "$VERSION"
            echo
            echo "## Install"
            echo
            echo "- Docker: \`ghcr.io/${{ github.repository }}:$VERSION\`"
            echo "- Debian/Ubuntu: \`slonbase_${VERSION}_amd64.deb\` / \`_arm64.deb\`"
            echo "- Fedora/RHEL: \`slonbase-${VERSION}-1.x86_64.rpm\` / \`.aarch64.rpm\`"
            echo "- Binaries: \`slonbase-${VERSION}-linux-{amd64,arm64}.tar.gz\`"
            echo
            echo "Verify downloads with \`sha256sum --ignore-missing -c SHA256SUMS\`. See the [installation guide](https://github.com/${{ github.repository }}/blob/v$VERSION/docs/installation.md)."
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: release-notes.md

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  # Updates the apt and dnf repositories. Started with a dispatch on the default branch, since
  # workflows don't trigger on releases made with GITHUB_TOKEN, and GitHub Pages deploys only
  # from the default branch.
  repositories:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run repo.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
