# Publishes a release: GitHub release with packages + checksums, a multi-arch image on ghcr.io,
# and the apt and dnf repositories. It runs
# - when CI passes on main and Cargo.toml has a version without a tag: it releases that commit
#   and creates the tag (bumping the version on main is how a release is made);
# - when a version tag (e.g. v0.1.0) is pushed by hand, which is how a backport to an older line
#   is released (it doesn't become the latest release or the image's `latest`);
# - when started by hand on a branch whose Cargo.toml has a version without a tag (another way
#   to release a backport, from a branch of the older line).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      release: ${{ steps.version.outputs.release }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: version
        name: Find the version to release
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$cargo_version" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $cargo_version"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$cargo_version" > /dev/null; then
            echo "v$cargo_version is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          # a backport (an older line's fix, released after a newer version) doesn't become latest
          newest=$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -v -- - | { cat; echo "$cargo_version"; } | sort -V | tail -1)
          if [ "$newest" = "$cargo_version" ]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Check CHANGELOG.md has the release notes
        if: steps.version.outputs.release == 'true'
        run: scripts/release-notes.sh "${{ steps.version.outputs.version }}" > /dev/null

  package:
    needs: verify
    if: needs.verify.outputs.release == 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      ref: ${{ needs.verify.outputs.sha }}

  publish:
    needs: [verify, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS
      - name: Release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            scripts/release-notes.sh "$VERSION"
            echo
            echo "## Install"
            echo
            echo "- Docker: \`ghcr.io/${{ github.repository }}:$VERSION\`"
            echo "- Debian/Ubuntu: \`slonbase_${VERSION}_amd64.deb\` / \`_arm64.deb\`"
            echo "- Fedora/RHEL: \`slonbase-${VERSION}-1.x86_64.rpm\` / \`.aarch64.rpm\`"
            echo "- Binaries: \`slonbase-${VERSION}-linux-{amd64,arm64}.tar.gz\`"
            echo
            echo "Verify downloads with \`sha256sum --ignore-missing -c SHA256SUMS\`. See the [installation guide](https://github.com/${{ github.repository }}/blob/v$VERSION/docs/installation.md)."
          } > release-notes.md

      # creates the tag on that commit when it doesn't exist yet
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          target_commitish: ${{ needs.verify.outputs.sha }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: release-notes.md
          make_latest: ${{ needs.verify.outputs.latest }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }}
            ${{ needs.verify.outputs.latest == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}

  # Updates the apt and dnf repositories. Started with a dispatch on the default branch, since
  # workflows don't trigger on releases made with GITHUB_TOKEN, and GitHub Pages deploys only
  # from the default branch.
  repositories:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run repo.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
