<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" width="760" height="365" role="img" aria-label="Several slonbase instances behind PgBouncer, with listeners connected directly"><title>Several slonbase instances behind PgBouncer, with listeners connected directly</title><style>
:root{--bg:#fff;--box:#fff;--line:#c4ccd4;--ink:#1f2328;--mute:#5d6670;--acc:#4f7a6c;--accbg:#e8f0ed;--pg:#5f7593;--pgbg:#e9eef5;--warn:#9a6b2f}
@media (prefers-color-scheme:dark){:root{--bg:#171a1d;--box:#20252a;--line:#3a424a;--ink:#e6e9ec;--mute:#9aa4ae;--acc:#7fb09f;--accbg:#233029;--pg:#8fa6c4;--pgbg:#232b36;--warn:#d1a05f}}
text{font:500 13px "IBM Plex Sans",system-ui,sans-serif;fill:var(--ink)}
.s{font-size:11.5px;fill:var(--mute);font-weight:400}
.t{font-weight:700;font-size:13px}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.us{fill:var(--accbg);stroke:var(--acc);stroke-width:1.4}
.pg{fill:var(--pgbg);stroke:var(--pg);stroke-width:1.4}
.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.ac{stroke:var(--acc);stroke-width:1.6;fill:none}
.pgl{stroke:var(--pg);stroke-width:1.6;fill:none}
.ln,.pgl,.ac{stroke-dasharray:4 6;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.ln,.pgl,.ac{animation:none}}
.dash{stroke-dasharray:5 4}
.ar{fill:var(--mute)}
</style><rect width="760" height="365" fill="var(--bg)" rx="10"/><rect class="box" x="10" y="135" width="100" height="60" rx="8"/><text class="t" x="60.0" y="170.0" text-anchor="middle">Clients</text><rect class="box" x="140" y="135" width="110" height="60" rx="8"/><text class="t" x="195.0" y="170.0" text-anchor="middle">Load balancer</text><rect class="us" x="290" y="30" width="130" height="56" rx="8"/><text class="t" x="355.0" y="63.0" text-anchor="middle">slonbase 1</text><path class="ln" d="M250 165 L290 58"/><path class="pgl" d="M420 58 L500 165"/><rect class="us" x="290" y="125" width="130" height="56" rx="8"/><text class="t" x="355.0" y="158.0" text-anchor="middle">slonbase 2</text><path class="ln" d="M250 165 L290 153"/><path class="pgl" d="M420 153 L500 165"/><rect class="us" x="290" y="220" width="130" height="56" rx="8"/><text class="t" x="355.0" y="253.0" text-anchor="middle">slonbase 3</text><path class="ln" d="M250 165 L290 248"/><path class="pgl" d="M420 248 L500 165"/><path class="ln" d="M110 165 L140 165"/><rect class="box" x="500" y="135" width="110" height="60" rx="8"/><text class="t" x="555.0" y="162.0" text-anchor="middle">PgBouncer</text><text class="s" x="555.0" y="179.0" text-anchor="middle">transaction mode</text><rect class="pg" x="650" y="135" width="100" height="60" rx="8"/><text class="t" x="700.0" y="170.0" text-anchor="middle">PostgreSQL</text><path class="pgl" d="M610 165 L650 165"/><path class="ac dash" d="M355 286 L355 318 L700 318 L700 195"/><text class="s" x="527" y="312" text-anchor="middle">LISTEN/NOTIFY: direct (database.listen_url)</text><text class="s" x="20" y="350" text-anchor="start">Queries go through the pooler; only each instance's listeners connect directly.</text></svg>