<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-label="Several slonbase instances behind a load balancer on one PostgreSQL server"><title>Several slonbase instances behind a load balancer on one PostgreSQL server</title><style>
:root{--bg:#171a1d;--box:#20252a;--line:#3a424a;--ink:#e6e9ec;--mute:#9aa4ae;--acc:#7fb09f;--accbg:#233029;--pg:#8fa6c4;--pgbg:#232b36;--warn:#d1a05f}

text{font:500 13px "IBM Plex Sans",system-ui,sans-serif;fill:var(--ink)}
.s{font-size:11.5px;fill:var(--mute);font-weight:400}
.t{font-weight:700;font-size:13px}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.us{fill:var(--accbg);stroke:var(--acc);stroke-width:1.4}
.pg{fill:var(--pgbg);stroke:var(--pg);stroke-width:1.4}
.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.ac{stroke:var(--acc);stroke-width:1.6;fill:none}
.pgl{stroke:var(--pg);stroke-width:1.6;fill:none}
.dash{stroke-dasharray:5 4}
.ar{fill:var(--mute)}
</style><rect width="760" height="390" fill="var(--bg)" rx="10"/><rect class="box" x="20" y="135" width="110" height="60" rx="8"/><text class="t" x="75.0" y="170.0" text-anchor="middle">Clients</text><rect class="box" x="170" y="135" width="120" height="60" rx="8"/><text class="t" x="230.0" y="162.0" text-anchor="middle">Load balancer</text><text class="s" x="230.0" y="179.0" text-anchor="middle">any, no affinity</text><rect class="us" x="350" y="40" width="150" height="60" rx="8"/><text class="t" x="425.0" y="75.0" text-anchor="middle">slonbase 1</text><path class="ln" d="M290 165 L350 70"/><path class="pgl" d="M500 70 L590 165"/><rect class="us" x="350" y="135" width="150" height="60" rx="8"/><text class="t" x="425.0" y="170.0" text-anchor="middle">slonbase 2</text><path class="ln" d="M290 165 L350 165"/><path class="pgl" d="M500 165 L590 165"/><rect class="us" x="350" y="230" width="150" height="60" rx="8"/><text class="t" x="425.0" y="265.0" text-anchor="middle">slonbase 3</text><path class="ln" d="M290 165 L350 260"/><path class="pgl" d="M500 260 L590 165"/><path class="ln" d="M130 165 L170 165"/><rect class="pg" x="590" y="125" width="150" height="80" rx="8"/><text class="t" x="665.0" y="162.0" text-anchor="middle">PostgreSQL</text><text class="s" x="665.0" y="179.0" text-anchor="middle">data · LISTEN/NOTIFY</text><rect class="box" x="350" y="310" width="150" height="44" rx="8"/><text class="t" x="425.0" y="337.0" text-anchor="middle">S3 or shared volume</text><path class="ln dash" d="M425 290 L425 310"/><text class="s" x="20" y="380" text-anchor="start">Files must be shared: S3, or one directory mounted on every instance.</text><text class="s" x="590" y="225" text-anchor="start">shared through PostgreSQL:</text><text class="s" x="590" y="241" text-anchor="start">tokens, schema, settings,</text><text class="s" x="590" y="257" text-anchor="start">rate limits, realtime, cron</text></svg>