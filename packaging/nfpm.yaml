# Builds .deb and .rpm packages:
#   cp target/<target>/release/slonbase dist/slonbase
#   VERSION=0.1.0 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
name: slonbase
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: web
priority: optional
maintainer: "slonbase maintainers <ayeshrodz@users.noreply.github.com>"
description: |
  An open-source backend platform on PostgreSQL.
  One binary with collections, a REST and realtime API, auth with roles, file storage, hooks
  and an admin dashboard for many projects, on your own PostgreSQL database. PostgreSQL is not
  bundled: point slonbase at a local or remote server from the first-run setup wizard.
vendor: slonbase
homepage: https://slonbase.com/
license: Apache-2.0

overrides:
  deb:
    recommends:
      - postgresql
  rpm:
    recommends:
      - postgresql-server

contents:
  - src: dist/slonbase
    dst: /usr/bin/slonbase
    file_info:
      mode: 0755
  - src: packaging/slonbase.service
    dst: /usr/lib/systemd/system/slonbase.service
    file_info:
      mode: 0644
  - src: packaging/default
    dst: /etc/default/slonbase
    type: config|noreplace
    file_info:
      mode: 0644
  # the license, the notice and the third-party licenses travel with every package
  - src: LICENSE
    dst: /usr/share/doc/slonbase/copyright
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/slonbase/LICENSE
    file_info:
      mode: 0644
  - src: NOTICE
    dst: /usr/share/doc/slonbase/NOTICE
    file_info:
      mode: 0644
  - src: THIRD-PARTY-LICENSES.md
    dst: /usr/share/doc/slonbase/THIRD-PARTY-LICENSES.md
    file_info:
      mode: 0644
  # owned by the slonbase user (set in postinstall, the user doesn't exist yet at unpack time)
  - dst: /etc/slonbase
    type: dir
    file_info:
      mode: 0750
  - dst: /var/lib/slonbase
    type: dir
    file_info:
      mode: 0750

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
